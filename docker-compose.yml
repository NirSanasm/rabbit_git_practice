# docker-compose.yml
version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ecom-rabbit
    ports:
      - "5672:5672"    # AMQP protocol port (your code talks to this)
      - "15672:15672"  # Management UI (browser)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: